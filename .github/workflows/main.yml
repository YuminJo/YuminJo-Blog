name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
      # 필요에 따라 빌드 옵션 추가
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: dist  # 빌드 결과 폴더

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - id: deployment
        uses: actions/deploy-pages@v4
